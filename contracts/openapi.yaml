{
  "openapi": "3.1.0",
  "info": {
    "title": "SGS · API de Governança de Dados de Saúde",
    "version": "0.1.0"
  },
  "paths": {
    "/health/live": {
      "get": {
        "tags": [
          "saúde"
        ],
        "summary": "O processo está no ar",
        "operationId": "live_health_live_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "tags": [
          "saúde"
        ],
        "summary": "A API está pronta: o banco responde",
        "operationId": "ready_health_ready_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          },
          "503": {
            "description": "O banco de dados não respondeu",
            "content": {
              "application/problem+json": {}
            }
          }
        }
      }
    },
    "/.well-known/jwks.json": {
      "get": {
        "tags": [
          "autenticação"
        ],
        "summary": "Chaves públicas de verificação dos access tokens",
        "operationId": "jwks__well_known_jwks_json_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Jwks"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/unidades": {
      "post": {
        "tags": [
          "unidades"
        ],
        "summary": "Cadastrar unidade de saúde",
        "description": "006/R1. Responde com a unidade criada, o `Location` dela e o `ETag` da versão.",
        "operationId": "criar_api_v1_unidades_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UnidadeCreate"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UnidadeOut"
                }
              }
            }
          },
          "401": {
            "description": "Sem access token válido",
            "content": {
              "application/problem+json": {}
            }
          },
          "403": {
            "description": "Sem `unidade:create` na área técnica do tipo informado",
            "content": {
              "application/problem+json": {}
            }
          },
          "409": {
            "description": "Já existe unidade com o mesmo CNES ou o mesmo nome no distrito",
            "content": {
              "application/problem+json": {}
            }
          },
          "422": {
            "description": "Campos inválidos, ou tipo de unidade ou distrito inexistente",
            "content": {
              "application/problem+json": {}
            }
          }
        },
        "security": [
          {
            "HTTPBearer": []
          }
        ]
      }
    }
  },
  "components": {
    "schemas": {
      "HealthStatus": {
        "properties": {
          "status": {
            "type": "string",
            "const": "ok",
            "title": "Status"
          }
        },
        "type": "object",
        "required": [
          "status"
        ],
        "title": "HealthStatus"
      },
      "Jwk": {
        "properties": {
          "kty": {
            "type": "string",
            "title": "Kty"
          },
          "crv": {
            "type": "string",
            "title": "Crv"
          },
          "alg": {
            "type": "string",
            "title": "Alg"
          },
          "use": {
            "type": "string",
            "title": "Use"
          },
          "kid": {
            "type": "string",
            "title": "Kid"
          },
          "x": {
            "type": "string",
            "title": "X"
          },
          "y": {
            "type": "string",
            "title": "Y"
          }
        },
        "type": "object",
        "required": [
          "kty",
          "crv",
          "alg",
          "use",
          "kid",
          "x",
          "y"
        ],
        "title": "Jwk",
        "description": "Chave pública EC P-256 no formato JWK (RFC 7517 e 7518)."
      },
      "Jwks": {
        "properties": {
          "keys": {
            "items": {
              "$ref": "#/components/schemas/Jwk"
            },
            "type": "array",
            "title": "Keys"
          }
        },
        "type": "object",
        "required": [
          "keys"
        ],
        "title": "Jwks"
      },
      "UnidadeCreate": {
        "properties": {
          "nome": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Nome"
          },
          "cnes": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^[0-9]{7}$",
                "description": "Sete dígitos."
              },
              {
                "type": "null"
              }
            ],
            "title": "Cnes",
            "description": "Sem CNES, a unidade fica pendente."
          },
          "tipo_unidade_id": {
            "type": "integer",
            "maximum": 32767.0,
            "minimum": 1.0,
            "title": "Tipo Unidade Id"
          },
          "distrito_id": {
            "type": "integer",
            "maximum": 32767.0,
            "minimum": 1.0,
            "title": "Distrito Id"
          },
          "cep": {
            "type": "string",
            "pattern": "^[0-9]{5}-?[0-9]{3}$",
            "title": "Cep",
            "description": "Oito dígitos, com ou sem hífen."
          },
          "endereco": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Endereco"
          },
          "bairro": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Bairro"
          },
          "telefone": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 20,
                "minLength": 1,
                "pattern": "^[0-9()+\\- ]+$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Telefone"
          },
          "nome_gestor": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 150,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Nome Gestor"
          },
          "latitude": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 90.0,
                "minimum": -90.0
              },
              {
                "type": "string",
                "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,3}|(?=[\\d.]{1,10}0*$)\\d{0,3}\\.\\d{0,6}0*$)"
              },
              {
                "type": "null"
              }
            ],
            "title": "Latitude"
          },
          "longitude": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 180.0,
                "minimum": -180.0
              },
              {
                "type": "string",
                "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,3}|(?=[\\d.]{1,10}0*$)\\d{0,3}\\.\\d{0,6}0*$)"
              },
              {
                "type": "null"
              }
            ],
            "title": "Longitude"
          },
          "status": {
            "type": "string",
            "enum": [
              "ativa",
              "inativa",
              "em_implantacao"
            ],
            "title": "Status"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "nome",
          "tipo_unidade_id",
          "distrito_id",
          "cep",
          "endereco",
          "status"
        ],
        "title": "UnidadeCreate",
        "description": "Unidade nova (006/R1.2: nome, tipo, distrito, endereço com CEP e status obrigatórios)."
      },
      "UnidadeOut": {
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid",
            "title": "Id"
          },
          "nome": {
            "type": "string",
            "title": "Nome"
          },
          "cnes": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Cnes"
          },
          "cnes_pendente": {
            "type": "boolean",
            "title": "Cnes Pendente"
          },
          "tipo_unidade_id": {
            "type": "integer",
            "title": "Tipo Unidade Id"
          },
          "distrito_id": {
            "type": "integer",
            "title": "Distrito Id"
          },
          "cep": {
            "type": "string",
            "title": "Cep"
          },
          "endereco": {
            "type": "string",
            "title": "Endereco"
          },
          "bairro": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Bairro"
          },
          "telefone": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Telefone"
          },
          "nome_gestor": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Nome Gestor"
          },
          "horario_funcionamento": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Horario Funcionamento"
          },
          "latitude": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Latitude"
          },
          "longitude": {
            "anyOf": [
              {
                "type": "number"
              },
              {
                "type": "null"
              }
            ],
            "title": "Longitude"
          },
          "status": {
            "type": "string",
            "enum": [
              "ativa",
              "inativa",
              "em_implantacao"
            ],
            "title": "Status"
          },
          "pendencias": {
            "type": "integer",
            "title": "Pendencias"
          },
          "versao": {
            "type": "integer",
            "title": "Versao"
          },
          "criado_em": {
            "type": "string",
            "format": "date-time",
            "title": "Criado Em"
          },
          "atualizado_em": {
            "type": "string",
            "format": "date-time",
            "title": "Atualizado Em"
          }
        },
        "type": "object",
        "required": [
          "id",
          "nome",
          "cnes",
          "cnes_pendente",
          "tipo_unidade_id",
          "distrito_id",
          "cep",
          "endereco",
          "bairro",
          "telefone",
          "nome_gestor",
          "horario_funcionamento",
          "latitude",
          "longitude",
          "status",
          "pendencias",
          "versao",
          "criado_em",
          "atualizado_em"
        ],
        "title": "UnidadeOut",
        "description": "A unidade completa. `versao` é a mesma do cabeçalho `ETag` (006/R3.2)."
      }
    },
    "securitySchemes": {
      "HTTPBearer": {
        "type": "http",
        "description": "Access token JWT emitido no login (spec 002).",
        "scheme": "bearer"
      }
    }
  }
}
