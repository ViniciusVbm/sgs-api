{
  "openapi": "3.1.0",
  "info": {
    "title": "SGS · API de Governança de Dados de Saúde",
    "version": "0.1.0"
  },
  "paths": {
    "/health/live": {
      "get": {
        "tags": [
          "saúde"
        ],
        "summary": "O processo está no ar",
        "operationId": "live_health_live_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "tags": [
          "saúde"
        ],
        "summary": "A API está pronta: o banco responde",
        "operationId": "ready_health_ready_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            }
          },
          "503": {
            "description": "O banco de dados não respondeu",
            "content": {
              "application/problem+json": {}
            }
          }
        }
      }
    },
    "/.well-known/jwks.json": {
      "get": {
        "tags": [
          "autenticação"
        ],
        "summary": "Chaves públicas de verificação dos access tokens",
        "operationId": "jwks__well_known_jwks_json_get",
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Jwks"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "HealthStatus": {
        "properties": {
          "status": {
            "type": "string",
            "const": "ok",
            "title": "Status"
          }
        },
        "type": "object",
        "required": [
          "status"
        ],
        "title": "HealthStatus"
      },
      "Jwk": {
        "properties": {
          "kty": {
            "type": "string",
            "title": "Kty"
          },
          "crv": {
            "type": "string",
            "title": "Crv"
          },
          "alg": {
            "type": "string",
            "title": "Alg"
          },
          "use": {
            "type": "string",
            "title": "Use"
          },
          "kid": {
            "type": "string",
            "title": "Kid"
          },
          "x": {
            "type": "string",
            "title": "X"
          },
          "y": {
            "type": "string",
            "title": "Y"
          }
        },
        "type": "object",
        "required": [
          "kty",
          "crv",
          "alg",
          "use",
          "kid",
          "x",
          "y"
        ],
        "title": "Jwk",
        "description": "Chave pública EC P-256 no formato JWK (RFC 7517 e 7518)."
      },
      "Jwks": {
        "properties": {
          "keys": {
            "items": {
              "$ref": "#/components/schemas/Jwk"
            },
            "type": "array",
            "title": "Keys"
          }
        },
        "type": "object",
        "required": [
          "keys"
        ],
        "title": "Jwks"
      }
    }
  }
}
