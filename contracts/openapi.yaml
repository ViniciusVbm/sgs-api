            "name": "ordem",
            "in": "query",
            "required": false,
            "schema": {
              "enum": [
                "nome",
                "distrito",
                "atualizacao"
              ],
              "type": "string",
              "default": "nome",
              "title": "Ordem"
            }
          },
          {
            "name": "pagina",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 1000000,
              "minimum": 1,
              "description": "Página, a partir de 1.",
              "default": 1,
              "title": "Pagina"
            },
            "description": "Página, a partir de 1."
          },
          {
            "name": "tamanho",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 100,
              "minimum": 1,
              "description": "Itens por página (padrão 20, máximo 100).",
