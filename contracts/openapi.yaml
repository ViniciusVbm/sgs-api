          },
          {
            "name": "distrito",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "integer",
                  "maximum": 32767,
                  "minimum": 1
                },
                {
                  "type": "null"
                }
              ],
              "title": "Distrito"
            }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "enum": [
                    "ativa",
                    "inativa",
                    "em_implantacao"
                  ],
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Status"
            }
          },
          {
            "name": "com_pendencias",
